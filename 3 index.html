<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMMENT</title>
  <link rel="stylesheet" href="通用.css">
  <link rel="stylesheet" href="3.css">
</head>
<body>
  <div class="container">
    <h1 class="page-title">快来交流交流</h1>
    
    <!-- 评论计数 -->
    <div class="comment-count">
      累计评论数：<span id="count-number">0</span>
    </div>

    <!-- 评论输入区域 -->
    <div class="comment-input-section">
      <textarea id="comment-input" placeholder="请输入你的评论..." rows="4"></textarea>
      <button id="submit-btn" class="btn">发表评论</button>
    </div>

    <!-- 评论列表 -->
    <div class="comment-list" id="comment-list">
      <!-- 评论会通过JS动态生成 -->
    </div>

    <!-- 返回首页按钮 -->
    <a href="1 index.html" class="btn back-btn">返回首页</a>
  </div>


  <script src="3.js"></script>
</body>
</html>
