<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>撤退的矮子</title>
  <link rel="stylesheet" href="通用.css">
  <link rel="stylesheet" href="2.css">
</head>
<body>
  <div class="container">
    <h1 class="page-title">characters</h1>
    
    <!-- 角色网格布局 -->
    <div class="characters-grid">
      <!-- 角色1：艾伦 -->
      <div class="character-card">
        <div class="avatar-container">
          <img src="伦.jpg" alt="艾伦" class="character-avatar"> <!-- 自行添加角色图片 -->
        </div>
        <div class="character-info">
          <h3 class="character-name">艾伦·耶格尔</h3>
          <p class="character-desc">
            <!-- 自行编辑角色介绍 -->
            本作主角，目标是驱逐所有巨人。
          </p>
          <p class="character-quote">
            <strong>名句：</strong> 我要把所有巨人都驱逐出去，一个不留！
          </p>
        </div>
      </div>


      <!-- 角色2：阿尔敏 -->
      <div class="character-card">
        <div class="avatar-container">
          <img src="敏.jpg" alt="阿尔敏·阿诺德" class="character-avatar"> <!-- 自行添加角色图片 -->
        </div>
        <div class="character-info">
          <h3 class="character-name">阿尔敏·阿诺德</h3>
          <p class="character-desc">
            <!-- 自行编辑角色介绍 -->
            拥有超高的智慧和战略眼光，后期继承了超大型巨人的力量。
          </p>
          <p class="character-quote">
            <strong>名句：</strong> 什么都无法舍弃的人，什么也改变不了。
          </p>
        </div>
      </div>

      <!-- 角色3：利威尔 -->
      <div class="character-card">
        <div class="avatar-container">
          <img src="levi.jpg" alt="利威尔·阿克曼" class="character-avatar"> <!-- 自行添加角色图片 -->
        </div>
        <div class="character-info">
          <h3 class="character-name">利威尔·阿克曼</h3>
          <p class="character-desc">
            <!-- 自行编辑角色介绍 -->
            调查兵团兵长，人类最强的士兵，性格冷酷但内心重视同伴。
          </p>
          <p class="character-quote">
            <strong>名句：</strong> 无悔的选择
          </p>
        </div>
      </div>
    </div>

    <!-- 返回首页按钮 -->
    <a href="index.html" class="btn back-btn">返回首页</a>
  </div>

</body>
</html>
